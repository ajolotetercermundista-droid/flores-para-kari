<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de las Flores Amarillas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: #000000; /* Negro puro */
        }

        /* --- FONDO DE HIERBA (Desvanecido) --- */
        .grass-background {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 40vh;
            background: linear-gradient(to top, rgba(20, 60, 20, 0.8) 0%, rgba(0, 0, 0, 0) 100%);
            z-index: 1; opacity: 0; animation: fadeInOutGrass 8s infinite ease-in-out;
        }
        @keyframes fadeInOutGrass {
            0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; }
        }

        /* --- PARTÍCULAS AMARILLAS --- */
        #particles-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
        }
        .particle {
            position: absolute; background-color: #ffd700; border-radius: 50%;
            box-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700;
            opacity: 0; animation: floatUp linear forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 1; } 80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* --- VIDEO CENTRAL --- */
        .video-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            z-index: 4; pointer-events: none;
        }
        .video-container video {
            max-width: 100%; max-height: 100%; object-fit: contain;
            border: none; outline: none; pointer-events: none; box-shadow: none;
            mix-blend-mode: screen; /* Hace que el fondo negro del video sea transparente */
        }

        /* --- BOTONES --- */
        .music-btn {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(255, 215, 0, 0.2); border: 2px solid #ffd700;
            color: #ffd700; padding: 10px 20px; border-radius: 30px;
            cursor: pointer; font-family: sans-serif; font-size: 14px;
            z-index: 10; transition: all 0.3s ease; backdrop-filter: blur(5px);
        }
        .music-btn:hover { background: #ffd700; color: #000; box-shadow: 0 0 20px #ffd700; }

        .magic-btn {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(255, 105, 180, 0.2); border: 2px solid #ff69b4;
            color: #ff69b4; padding: 10px 20px; border-radius: 30px;
            cursor: pointer; font-family: sans-serif; font-size: 14px;
            z-index: 10; transition: all 0.3s ease; backdrop-filter: blur(5px);
        }
        .magic-btn:hover { background: #ff69b4; color: #fff; box-shadow: 0 0 20px #ff69b4; }

        /* --- MAGIA (Mariposas y Corazones) --- */
        .magic-item {
            position: absolute;
            bottom: -60px;
            z-index: 6;
            pointer-events: none;
            animation: floatUpMagic linear forwards;
            filter: drop-shadow(0 0 5px currentColor) drop-shadow(0 0 10px currentColor);
        }
        
        @keyframes floatUpMagic {
            0% { transform: translateY(0) translateX(0) scale(0.3) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-110vh) translateX(30px) scale(1) rotate(20deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="grass-background"></div>
    <div id="particles-container"></div>

    <!-- VIDEO CENTRAL -->
    <div class="video-container">
        <video autoplay loop muted playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <!-- BOTONES -->
    <button class="magic-btn" id="magicBtn">✨ Botón Secreto ✨</button>
    <button class="music-btn" id="musicBtn">▶ Reproducir Música</button>
    
    <audio id="bgMusic" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- 1. GENERADOR DE PARTÍCULAS ---
        const particlesContainer = document.getElementById('particles-container');
        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const size = Math.random() * 5 + 3;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}vw`;
            const duration = Math.random() * 5 + 5;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `${Math.random() * 2}s`;
            particlesContainer.appendChild(particle);
            setTimeout(() => { particle.remove(); }, duration * 1000);
        }
        setInterval(createParticle, 300);

        // --- 2. MÚSICA ---
        const musicBtn = document.getElementById('musicBtn');
        const bgMusic = document.getElementById('bgMusic');
        let isPlaying = false;
        musicBtn.addEventListener('click', () => {
            if (!isPlaying) {
                bgMusic.play(); musicBtn.textContent = '⏸ Pausar Música'; isPlaying = true;
            } else {
                bgMusic.pause(); musicBtn.textContent = '▶ Reproducir Música'; isPlaying = false;
            }
        });

        // --- 3. MAGIA (Mariposas y Corazones) ---
        const magicBtn = document.getElementById('magicBtn');
        
        // Diseños en SVG (solo contorno)
        const heartSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:100%; height:100%;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;
        
        const butterflySVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:100%; height:100%;"><path d="M12 8c-3-4-8-4-9 0s2 6 5 7c-3 1-5 4-3 6s6-1 7-4c1 3 5 5 7 4s1-5-3-6c3-1 5-4 5-7s-6-4-9 0z"></path><path d="M12 8v10"></path><path d="M12 8c0-2-2-3-2-3"></path><path d="M12 8c0-2 2-3 2-3"></path></svg>`;

        function createMagicItem() {
            const item = document.createElement('div');
            item.classList.add('magic-item');
            
            // Elegir aleatoriamente entre corazón y mariposa
            const isButterfly = Math.random() > 0.5;
            item.innerHTML = isButterfly ? butterflySVG : heartSVG;
            
            // Color fosforescente aleatorio usando HSL
            const hue = Math.floor(Math.random() * 360);
            const color = `hsl(${hue}, 100%, 70%)`;
            item.style.color = color;
            
            // Tamaño aleatorio (entre 25px y 60px)
            const size = Math.random() * 35 + 25;
            item.style.width = `${size}px`;
            item.style.height = `${size}px`;
            
            // Posición inicial aleatoria en el ancho
            item.style.left = `${Math.random() * 100}vw`;
            
            // Duración aleatoria (entre 4 y 9 segundos)
            const duration = Math.random() * 5 + 4;
            item.style.animationDuration = `${duration}s`;
            
            document.body.appendChild(item);

            // Eliminar del DOM cuando termine la animación
            setTimeout(() => {
                item.remove();
            }, duration * 1000);
        }

        // Evento al presionar el botón
        magicBtn.addEventListener('click', () => {
            // Generar entre 4 y 8 figuras por clic
            const count = Math.floor(Math.random() * 5) + 4;
            for (let i = 0; i < count; i++) {
                // Un pequeño retraso escalonado para que no salgan todas al mismo tiempo
                setTimeout(createMagicItem, i * 150);
            }
        });
    </script>
</body>
</html>
